<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Lernwege – Mathematik</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap');

:root{
  --papier:#F4F6FA; --netz:#DCE3EE; --netzfein:#E9EEF6; --tinte:#16233D;
  --weich:#5D6C88; --marker:#E8336D; --ziel:#0E9C9C; --gold:#E8A33D;
  --gruen:#2E8B57; --rot:#C4304F; --rand:#C9D4E4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);color:var(--tinte);
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding:22px 16px 70px}
.wrap{max-width:940px;margin:0 auto}
h1{font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:700;margin:2px 0 0;letter-spacing:-.02em}
h2{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 4px}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--weich);text-transform:uppercase}
.karte{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:18px}
.mono{font-family:'IBM Plex Mono',monospace}
.weich{color:var(--weich)}
.klein{font-size:12.5px}

button{font-family:inherit;cursor:pointer}
.btn{background:var(--tinte);color:#fff;border:none;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn-2{background:#fff;color:var(--weich);border:1px solid var(--rand);border-radius:9px;padding:10px 16px;font-size:13px}
.btn-m{background:var(--marker);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:600}
.link{background:none;border:none;color:var(--weich);font-size:13px;text-decoration:underline;padding:0}

input,textarea{width:100%;border:1px solid var(--rand);border-radius:9px;padding:12px 13px;
  font-size:14px;font-family:inherit;line-height:1.6;outline:none;background:#fff;color:var(--tinte)}
textarea{resize:vertical}
input:focus,textarea:focus{border-color:var(--tinte)}

.lw-grid{display:grid;grid-template-columns:252px minmax(0,1fr);gap:16px;align-items:start}
.lw-side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:860px){
  .lw-grid{grid-template-columns:minmax(0,1fr)}
  .lw-side{position:static;max-height:none}
}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'+';display:inline-block;width:15px;color:var(--weich);font-weight:400}
details[open]>summary::before{content:'\2212'}

.etappen{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.et{flex:1 0 auto;min-width:104px;text-align:left;padding:8px 10px;border-radius:9px;
  background:#fff;color:var(--tinte);border:1px solid var(--rand)}
.et.aktiv{background:var(--tinte);color:#fff;border-color:var(--tinte)}
.et.zu{background:var(--papier);color:#AAB6C8;cursor:default}
.et .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.7}
.et .t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;margin-top:1px}

.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;
  border:1.5px solid var(--rand);background:#fff;border-radius:9px;
  font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--tinte)}
.opt.richtig{border-color:var(--gruen);background:#F0F8F3}
.opt.falsch{border-color:var(--marker);background:#FEF5F7}
.opt.aus{cursor:default}

.kasten{border-radius:9px;padding:14px;font-size:13.5px;line-height:1.65;margin-top:14px;white-space:pre-wrap}
.k-grau{background:var(--papier)}
.k-gruen{background:#F0F8F3;border:1px solid #2E8B5744}
.k-gold{background:#FFF9EF;border:1px solid #E8A33D55}
.k-rot{background:#FEF5F7;border:1px solid #E8336D33}

.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:.1em;border-radius:5px;padding:2px 8px}

table{border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:6px 8px 6px 0;color:var(--weich);font-weight:500;font-size:11px}
td{padding:5px 8px 5px 0}
.zelle{width:24px;height:20px;border-radius:5px;border:1px solid var(--rand);background:var(--papier);
  font-size:10.5px;text-align:center;line-height:19px;font-family:'IBM Plex Mono',monospace}
.zelle.ok{background:#2E8B5722;border-color:#2E8B5766;color:var(--gruen)}
.zelle.teil{background:#E8A33D22;border-color:#E8A33D66;color:var(--gold)}
.zelle.warn{background:#E8336D22;border-color:#E8336D66;color:var(--marker)}

.balken{height:7px;background:var(--netzfein);border-radius:4px;overflow:hidden}
.balken>div{height:100%;border-radius:4px}

</style>
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:20px">
    <div class="kicker">Mathematik · Einführungsphase</div>
    <h1>Lernwege</h1>
  </div>
  <div id="app"></div>
</div>

    {t:"Definitionsmenge D", e:[1,2,4], x:"Alle Zahlen, die man für x einsetzen darf. Im Sachkontext oft kleiner als das, was der Term zulässt: Negative Zeiten sind rechnerisch möglich, in der Situation aber sinnlos.\n\nSchreibweise: D = [0; 60] heißt alle Zahlen von 0 bis 60 einschließlich der Ränder."},
    {t:"Wertemenge W", e:[1,2], x:"Alle Werte, die als Ergebnis y tatsächlich herauskommen können.\n\nSchreibweise: W = [1,20; ∞[ heißt alle Zahlen ab 1,20 nach oben ohne Ende. Die nach außen gedrehte Klammer bedeutet: Der Rand gehört nicht dazu."},
    {t:"Funktionsterm und Funktionsgleichung", e:[2], x:"Der Funktionsterm ist die Rechenvorschrift, z. B. 0,22x + 1,20.\nDie Funktionsgleichung stellt sie einer Größe gegenüber: f(x) = 0,22x + 1,20."},
    {t:"Lineare Funktion", e:[2,3], x:"f(x) = m · x + b\n\nm heißt Steigung: Um so viel ändert sich y, wenn x um 1 wächst. Die Einheit von m ist immer „Einheit von y je Einheit von x“.\n\nb heißt y-Achsenabschnitt: der Funktionswert an der Stelle x = 0."},
    {t:"Steigung aus zwei Punkten", e:[3,4], x:"Für A(x₁ | y₁) und B(x₂ | y₂) gilt\n\nm = (y₂ − y₁) / (x₂ − x₁)\n\nDie Differenz allein reicht nicht — es muss geteilt werden."},
    {t:"Achsenschnittpunkte", e:[4,5], x:"Schnittpunkt mit der y-Achse: x = 0 einsetzen, also f(0) berechnen.\n\nSchnittpunkt mit der x-Achse (Nullstelle): f(x) = 0 setzen und nach x auflösen."},
    {t:"Schnittpunkt zweier Graphen", e:[5,7], x:"Beide Funktionsterme gleichsetzen und nach x auflösen. Den x-Wert dann in eine der Funktionen einsetzen, um y zu erhalten.\n\nAchtung: Das ist etwas anderes als eine Nullstelle. Dort schneidet ein Graph die x-Achse, hier schneiden sich zwei Graphen."},
    {t:"Verschieben von Graphen", e:[3,6], x:"f(x) + c verschiebt um c in y-Richtung (nach oben bei c > 0).\n\nf(x − d) verschiebt um d in x-Richtung (nach rechts bei d > 0). Das Minus wirkt auf das Argument, nicht auf das Ergebnis."}
  ],
  etappen:[
  {nr:1, titel:"Losfahren", frage:"Welche Größen hängen hier zusammen?", sozial:"ICH", aufgaben:[
    {id:"LA1", typ:"frei", komp:"L_K1", afb:"II",
     stamm:"Ein Anbieter für E-Roller verlangt 1,20 € Startgebühr und danach 0,22 € pro Fahrminute. Ein Roller kann höchstens 60 Minuten am Stück ausgeliehen werden.\n\nWelche Zahlen darf man hier sinnvollerweise für die Fahrzeit einsetzen und welche nicht? Gib die Definitionsmenge an.",
     platzhalter:"Sinnvoll einsetzen kann man … , nicht aber … . Also D = …",
     loesung:"D = [0; 60].\n\nNegative Zeiten kann man in den Term einsetzen — er liefert brav eine Zahl. In der Situation ergibt das aber keinen Sinn: Eine Fahrt von −5 Minuten gibt es nicht. Nach oben begrenzt die Ausleihregel bei 60 Minuten.\n\nDas ist der Kern: Der Term erlaubt mehr als die Situation. Wenn du die Grenzen in Worten beschrieben hast statt in Intervallschreibweise, ist das genauso richtig.",

     tipps:["Setze −5 Minuten ein: Der Term liefert eine Zahl. Ergibt sie in dieser Situation einen Sinn?","Wie lange darf man den Roller laut Text höchstens behalten?"]}
  ]},
  {nr:2, titel:"Bauen", frage:"Wie lautet die Funktionsgleichung?", sozial:"ICH", aufgaben:[
    {id:"LA2", typ:"frei", komp:"L_K1", afb:"II",
     stamm:"Derselbe Tarif: 1,20 € Startgebühr, danach 0,22 € pro Fahrminute.\n\nStelle die Funktionsgleichung auf, mit der man die Kosten f(x) für eine Fahrt von x Minuten berechnet.",
     platzhalter:"f(x) = …",
     loesung:"f(x) = 0,22x + 1,20\n\nDie 0,22 € fallen in jeder Minute an. Bei 10 Minuten also zehnmal — deshalb wird sie mit x multipliziert.\nDie 1,20 € fallen genau einmal an, egal wie lange du fährst. Deshalb steht sie allein.\n\nProbe: 10 Minuten kosten 0,22 · 10 + 1,20 = 3,40 €.",

     geruest:"Gerüst: 1) Was kostet die Fahrt bei 0 Minuten? 2) Was kommt pro Minute dazu? 3) Was kostet eine Fahrt von 10 Minuten — rechne es erst einzeln aus. 4) Schreibe die Rechnung mit x statt mit 10.",
     tipps:["Rechne zuerst konkret: Was kostet eine Fahrt von 10 Minuten?","Fällt die Startgebühr in jeder Minute erneut an oder nur einmal?"]},
    {id:"LA3", typ:"mc", komp:"L_K1", afb:"I",
     stamm:"Lineare Funktionen schreibt man allgemein als f(x) = m · x + b. Für den Roller-Tarif f(x) = 0,22x + 1,20 gilt:",
     optionen:[{text:"m = 0,22 Euro je Minute, b = 1,20 Euro", richtig:true},
               {text:"m = 1,20 Euro je Minute, b = 0,22 Euro", mv:"L1"},
               {text:"m = 0,22 Euro, b = 1,20 Euro", mv:"L4"},
               {text:"m = 0,22 Euro je Minute, b = 1,42 Euro", mv:"L6"}],
     tipps:["Welche der beiden Zahlen hängt von der Fahrzeit ab?","Bei m gehören zwei Größen in die Einheit: Euro und Minuten."]},
    {id:"LA4", typ:"frei", komp:"L_K1", afb:"II",
     stamm:"Für f(x) = 0,22x + 1,20 mit D = [0; 60]:\n\nGib die Wertemenge W an.",
     platzhalter:"W = [ … ; … ]",
     loesung:"W = [1,20; 14,40]\n\nDie Kosten sind am kleinsten bei x = 0: f(0) = 1,20 €.\nSie sind am größten bei x = 60: f(60) = 0,22 · 60 + 1,20 = 13,20 + 1,20 = 14,40 €.\n\nWeil die Funktion steigt, liegen dazwischen alle Werte. In Worten: von 1,20 € bis 14,40 € — auch das ist eine richtige Antwort.",

     tipps:["Was ist das Günstigste, was eine Fahrt kosten kann?","Setze die beiden Ränder der Definitionsmenge ein: x = 0 und x = 60."]}
  ]},
  {nr:3, titel:"Verändern", frage:"Was macht m mit der Geraden?", sozial:"ICH", aufgaben:[
    {id:"LA5", typ:"vermutung", komp:"L_K2", afb:"II",
     zugang:{qr:"ggbEntd", quelle:"GeoGebra · Entdeckungen an linearen Funktionen", url:"https://www.geogebra.org/m/DYJRjsKV"},
     stamm:"In f(x) = m · x + b gibt m an, um wie viel sich y ändert, wenn x um 1 wächst. Beim Roller war m = 0,22.\n\nSchreibe auf, wie der Graph aussieht, wenn m negativ ist – und wie, wenn m zwischen 0 und 1 liegt.",
     platzhalter:"Wenn m negativ ist, dann … Wenn m zwischen 0 und 1 liegt, dann …",
     nachher:"Und? Stimmte deine Vermutung, oder war etwas anders als gedacht?",
     loesung:"m negativ: Die Gerade fällt. Pro Schritt nach rechts geht es um |m| nach unten.\n\n0 < m < 1: Die Gerade STEIGT — nur flacher als y = x. Das überrascht viele, weil „kleiner als 1“ nach „weniger“ klingt. Entscheidend ist aber allein das Vorzeichen: Solange m positiv ist, geht es aufwärts.\n\nMerke: Das Vorzeichen entscheidet über steigend oder fallend, der Betrag über die Steilheit.",

     tipps:["Was hieße m = −0,22 beim Roller in Worten?","Setze m = 0,5 ein und rechne die Werte für x = 1, 2 und 3 aus. Steigt das oder fällt es?"]},
    {id:"LA6", typ:"frei", komp:"L_K2", afb:"III",
     stamm:"Gegeben ist f(x) = 2x + 1. Der Graph wird um 3 Einheiten nach rechts verschoben; die neue Funktion ist g(x) = f(x − 3).\n\nBerechne den Term von g und vergleiche ihn mit f. Was hat sich geändert, was nicht?",
     platzhalter:"g(x) = 2 · ( … ) + 1 = … . Geändert hat sich … , gleich geblieben ist …",
     loesung:"g(x) = 2(x − 3) + 1 = 2x − 6 + 1 = 2x − 5\n\nGleich geblieben: die Steigung 2.\nGeändert: der y-Achsenabschnitt, von 1 auf −5 — also um 6.\n\nUnd jetzt das Erstaunliche: Dieselbe Gerade bekommst du auch, wenn du f einfach um 6 nach UNTEN verschiebst. Bei Geraden kann man einer verschobenen Gerade nicht ansehen, ob sie zur Seite oder nach oben/unten verschoben wurde. Die 6 ist dabei kein Zufall: Sie ist m · d = 2 · 3.\n\nBei Parabeln geht das nicht — dort verrät der Scheitelpunkt die Richtung.",

     geruest:"Gerüst: 1) Setze in f(x) = 2x + 1 statt x den Ausdruck (x − 3) ein. 2) Multipliziere die Klammer aus. 3) Fasse zusammen. 4) Schreibe beide Steigungen und beide y-Achsenabschnitte nebeneinander.",
     tipps:["Setze in f(x) = 2x + 1 für x den ganzen Ausdruck (x − 3) ein.","Vergleiche zuerst nur die Steigungen von f und g."]}
  ]},
  {nr:4, titel:"Genauer werden", frage:"Wo schneidet der Graph die Achsen?", sozial:"ICH", aufgaben:[
    {id:"LA7", typ:"frei", komp:"L_K3", afb:"II",
     stamm:"Gegeben ist f(x) = −0,75x + 6.\n\nBestimme rechnerisch beide Achsenschnittpunkte.",
     platzhalter:"Schnittpunkt mit der y-Achse: … . Schnittpunkt mit der x-Achse: …",
     loesung:"y-Achse: Dort ist x = 0. Also f(0) = 6. Der Punkt ist S_y(0 | 6).\n\nx-Achse: Dort ist y = 0. Also −0,75x + 6 = 0\n→ −0,75x = −6\n→ x = 8\nDer Punkt ist S_x(8 | 0).\n\nAchte darauf, beide Punkte als Koordinatenpaare anzugeben, nicht nur als Zahlen.",

     tipps:["Welche Koordinate hat jeder Punkt, der auf der y-Achse liegt?","Für die Nullstelle: Setze den ganzen Term gleich 0 und löse nach x auf."]},
    {id:"LA8", typ:"mc", komp:"L_K3", afb:"II",
     stamm:"Für den Roller-Tarif f(x) = 0,22x + 1,20 mit D = [0; 60] liefert die Rechnung f(x) = 0 den Wert x ≈ −5,45. Wie ist das zu deuten?",
     optionen:[{text:"Rechnerisch korrekt, aber außerhalb der Definitionsmenge – in dieser Situation ohne Bedeutung.", richtig:true},
               {text:"Nach 5,45 Minuten ist die Fahrt kostenlos.", mv:"L9"},
               {text:"Es liegt ein Rechenfehler vor, denn Nullstellen sind nie negativ.", mv:"L8"},
               {text:"Die Funktion hat keine Nullstelle, weil Kosten nicht null werden können.", mv:"L9"}],
     tipps:["Was war in Etappe 1 die Definitionsmenge?","Der Term liefert für jedes x eine Zahl. Bedeutet jede dieser Zahlen auch etwas in der Situation?"]}
  ]},
  {nr:5, titel:"Umkehren", frage:"Wann sind zwei Tarife gleich teuer?", sozial:"DU",
   zugang:{qr:"ggbAuto", quelle:"GeoGebra · Autoverleih", url:"https://www.geogebra.org/m/eSFx34nb", hinweis:"Zur grafischen Kontrolle eurer Rechnung."}, aufgaben:[
    {id:"LA9", typ:"frei", komp:"L_K3", afb:"II",
     stamm:"Anbieter A: f(x) = 0,22x + 1,20 · Anbieter B: g(x) = 0,30x + 0,50\n\nBerechnet, bei welcher Fahrzeit beide Anbieter gleich viel kosten.",
     platzhalter:"Gleichsetzen: … . Also x = … Minuten.",
     loesung:"Gleich teuer heißt: gleiche Funktionswerte.\n\n0,22x + 1,20 = 0,30x + 0,50   | −0,22x\n1,20 = 0,08x + 0,50   | −0,50\n0,70 = 0,08x   | :0,08\nx = 8,75\n\nNach 8,75 Minuten kosten beide gleich viel. Danach ist A günstiger, weil A pro Minute weniger verlangt.\n\nProbe bei x = 5: A kostet 2,30 €, B kostet 2,00 € — B ist noch vorn. Passt.",

     geruest:"Gerüst: 1) Was muss gelten, damit beide Tarife gleich viel kosten? 2) Setzt die beiden Terme gleich. 3) Bringt alle x-Terme auf eine Seite, alle Zahlen auf die andere. 4) Teilt zum Schluss.",
     tipps:["Was bedeutet „gleich teuer“ für die beiden Funktionswerte?","Zieht auf beiden Seiten 0,22x ab und danach 0,50."]},
    {id:"LA10", typ:"mc", komp:"L_K4", afb:"III",
     stamm:"Beim Gleichsetzen zweier linearer Funktionen ergibt sich die Gleichung 4 = 7. Was folgt daraus?",
     optionen:[{text:"Die Graphen sind parallel und verschieden – es gibt keinen Schnittpunkt.", richtig:true},
               {text:"Es liegt ein Rechenfehler vor, denn 4 = 7 ist unmöglich.", mv:"L8"},
               {text:"Die Graphen sind identisch, es gibt unendlich viele Schnittpunkte.", mv:"L8"},
               {text:"Der Schnittpunkt liegt bei x = 3, der Differenz der beiden Zahlen.", mv:"L7"}],
     tipps:["Was müsste für x gelten, damit 4 = 7 wahr wird?","Wenn es kein x gibt, bei dem beide Funktionswerte übereinstimmen – wie liegen die Geraden dann zueinander?"]}
  ]},
  {nr:6, titel:"Anwenden", frage:"Passt das Modell überhaupt?", sozial:"ICH", aufgaben:[
    {id:"LA11", typ:"frei", komp:"L_K1", afb:"III",
     stamm:"Ein dritter Anbieter wirbt: „Die ersten 5 Minuten kosten pauschal 2 €. Jede weitere Minute kostet 0,15 €.“\n\nErkläre, warum sich dieser Tarif nicht durch eine einzige lineare Funktion beschreiben lässt.",
     platzhalter:"Eine einzige lineare Funktion reicht nicht, weil …",
     loesung:"Weil sich die Kosten nicht überall gleich schnell ändern.\n\nZwischen Minute 2 und 3 kommt nichts dazu — die Pauschale gilt.\nZwischen Minute 7 und 8 kommen 0,15 € dazu.\n\nEine lineare Funktion hat aber überall dieselbe Steigung. Hier wechselt sie von 0 auf 0,15. Man bräuchte also zwei Teilfunktionen mit zwei Bereichen (eine abschnittsweise Definition).\n\nFür x ≥ 5 wäre das: f(x) = 0,15 · (x − 5) + 2",

     tipps:["Was kostet die Fahrt bei 3 Minuten, was bei 5, was bei 6?","Wie viel kommt zwischen Minute 2 und 3 dazu? Und wie viel zwischen Minute 7 und 8?"]}
  ]},
  {nr:7, titel:"Begründen", frage:"Stimmt Timos Behauptung?", sozial:"DU", aufgaben:[
    {id:"LA12", typ:"frei", komp:"L_K4", afb:"III",
     stamm:"Timo behauptet: „Zwei Geraden mit verschiedenen Steigungen schneiden sich immer genau einmal.“\n\nStimmt das? Begründet zu zweit. Rechnet dabei allgemein mit f(x) = m₁x + b₁ und g(x) = m₂x + b₂.",
     platzhalter:"Die Behauptung ist …, denn Gleichsetzen ergibt …",
     loesung:"Timo hat recht — und das ist hier die Schwierigkeit: Man sucht reflexhaft ein Gegenbeispiel und findet keins.\n\nGleichsetzen:\nm₁x + b₁ = m₂x + b₂\nm₁x − m₂x = b₂ − b₁\nx · (m₁ − m₂) = b₂ − b₁\nx = (b₂ − b₁) / (m₁ − m₂)\n\nTeilen darf man nur, wenn m₁ − m₂ ≠ 0 ist. Genau das ist vorausgesetzt: verschiedene Steigungen. Also gibt es immer genau eine Lösung — einen Schnittpunkt.\n\nUnd wenn m₁ = m₂ wäre? Dann stünde eine 0 im Nenner: die Geraden sind parallel. Das ist derselbe Fall wie das „4 = 7“ aus Etappe 5.",

     geruest:"Gerüst: 1) Setzt m₁x + b₁ = m₂x + b₂. 2) Bringt alle x-Terme nach links und alle Zahlen nach rechts. 3) Klammert x aus. 4) Teilt durch die Klammer — und prüft, ob sie null werden kann.",
     tipps:["Rechnet nicht mit Zahlen, sondern mit m₁, m₂, b₁ und b₂.","In eurem Ergebnis steht m₁ − m₂ im Nenner. Wann wäre das ein Problem, und ist dieser Fall hier ausgeschlossen?"]}
  ]}
  ]
},
{
  id:"quad", titel:"Quadratische Funktionen", klasse:"E-Phase · E.1", akzent:"#0E9C9C",
  kurz:"Symmetrie, Grenzverhalten, Verschiebung, Streckung und Schnittpunkte.",
  kompetenzen:[
    {id:"Q_K1", text:"Ich kann Symmetrie und Grenzverhalten einer Parabel begründen und angeben."},
    {id:"Q_K2", text:"Ich kann Verschiebungen an der Scheitelform erkennen und begründen."},
    {id:"Q_K3", text:"Ich kann Streckungen in x- und y-Richtung unterscheiden."},
    {id:"Q_K4", text:"Ich kann Achsenschnittpunkte und Schnittpunkte mit einer Geraden rechnerisch bestimmen."}
  ],
  wissen:[
    {t:"Normalparabel", e:[1,2,3], x:"Der Graph von f(x) = x² heißt Normalparabel. Ihr tiefster Punkt ist der Scheitelpunkt S(0 | 0)."},
    {t:"Achsensymmetrie", e:[1,2], x:"Ein Graph ist symmetrisch zur y-Achse, wenn für alle x gilt:\n\nf(−x) = f(x)\n\nBei der Normalparabel ist das erfüllt, weil (−a)² = a² gilt."},
    {t:"Definitions- und Wertemenge", e:[2], x:"D: alle einsetzbaren x-Werte. Bei Parabeln ohne Sachkontext ist D = ℝ.\n\nW: alle vorkommenden Funktionswerte. Bei f(x) = x² ist W = [0; ∞[, weil ein Quadrat nie negativ wird."},
    {t:"Verhalten für betragsgroße x", e:[2], x:"Beschreibt, wohin die Funktionswerte laufen, wenn x sehr groß oder sehr klein wird.\n\nSchreibweise: lim f(x) = ∞ für x → ∞\n\nBei quadratischen Funktionen entscheidet allein das Vorzeichen des Faktors vor x²: positiv heißt beidseitig nach oben, negativ beidseitig nach unten."},
    {t:"Scheitelform", e:[3,4,5], x:"f(x) = a · (x − d)² + e\n\nScheitelpunkt: S(d | e)\n\nVorsicht: Bei f(x) = (x + 4)² − 5 schreibt man (x + 4) als (x − (−4)), also d = −4 und S(−4 | −5)."},
    {t:"Verschieben von Graphen", e:[3], x:"f(x) + e verschiebt um e in y-Richtung (nach oben bei e > 0).\n\nf(x − d) verschiebt um d in x-Richtung (nach rechts bei d > 0). Das Minus wirkt auf das Argument, nicht auf das Ergebnis."},
    {t:"Streckfaktor a", e:[4], x:"In f(x) = a · x² gilt:\n\n|a| > 1 → Parabel schmaler\n|a| < 1 → Parabel breiter\na < 0 → nach unten geöffnet"},
    {t:"Nullstellen aus der Scheitelform", e:[5,6], x:"f(x) = 0 setzen und so umstellen, dass nur noch das Quadrat auf einer Seite steht. Dann die Wurzel ziehen.\n\nWichtig: Beim Wurzelziehen entstehen ZWEI Fälle, ein positiver und ein negativer. Sonst geht eine Nullstelle verloren."},
    {t:"Schnittpunkte zweier Graphen", e:[6,7], x:"Beide Terme gleichsetzen und alles auf eine Seite bringen. Bei Parabel und Gerade entsteht eine quadratische Gleichung.\n\nSie kann zwei, eine oder keine Lösung haben — entsprechend zwei Schnittpunkte, ein Berührpunkt oder gar keiner."}
  ],
  etappen:[
  {nr:1, titel:"Losfahren", frage:"Wo liegt der höchste Punkt?", sozial:"ICH", aufgaben:[
    {id:"QA1", typ:"frei", komp:"Q_K1", afb:"II",
     stamm:"Ein Ball wird geworfen und landet nach 4 Sekunden wieder auf dem Boden. Seine Flugbahn hat die Form einer Parabel.\n\nNach wie vielen Sekunden ist er am höchsten? Begründe ohne zu rechnen.",
     platzhalter:"Nach … Sekunden, weil die Parabel …",
     loesung:"Nach 2 Sekunden.\n\nBegründung: Eine Parabel ist achsensymmetrisch. Die Symmetrieachse verläuft senkrecht durch den Scheitelpunkt. Start (0 s) und Landung (4 s) sind gespiegelte Punkte, also liegt die Achse genau in der Mitte: bei 2 s.\n\nWichtig ist, dass du die Symmetrie NENNST. „Weil das in der Mitte ist“ stimmt, sagt aber noch nicht, warum die Mitte der höchste Punkt sein muss.",

     tipps:["Wenn du die Zeichnung senkrecht in der Mitte faltest – passen beide Hälften aufeinander?","Zwischen welchen beiden Zeitpunkten liegt die Flugkurve, und wo genau ist die Mitte?"]}
  ]},
  {nr:2, titel:"Bauen", frage:"Was zeichnet f(x) = x² aus?", sozial:"ICH", aufgaben:[
    {id:"QA2", typ:"frei", komp:"Q_K1", afb:"II",
     stamm:"Lege im Heft eine Wertetabelle für f(x) = x² an, mit x von −3 bis 3.\n\nVergleiche die Werte für x und −x. Was stellst du fest, und wie kannst du es am Term begründen?",
     platzhalter:"Für x und −x kommt … heraus. Am Term sieht man das daran, dass …",
     loesung:"Gespiegelte Stellen liefern denselben Wert: f(2) = 4 und f(−2) = 4, f(3) = 9 und f(−3) = 9.\n\nAm Term: f(−a) = (−a)² = (−a) · (−a) = a² = f(a)\n\nBeim Quadrieren verschwindet das Minus, weil minus mal minus plus ergibt. Deshalb gilt f(−x) = f(x) für alle x — und genau das bedeutet Achsensymmetrie zur y-Achse.",

     tipps:["Rechne (−2)² und 2² beide aus. Was fällt auf?","Was passiert mit dem Vorzeichen, wenn man eine negative Zahl mit sich selbst multipliziert?"]},
    {id:"QA3", typ:"frei", komp:"Q_K1", afb:"I",
     stamm:"Für f(x) = x² ohne Sachkontext:\n\nGib Definitionsmenge und Wertemenge an und begründe die Wertemenge kurz.",
     platzhalter:"D = … , W = … . Die Wertemenge ist so, weil …",
     loesung:"D = ℝ — jede Zahl lässt sich quadrieren, es gibt keine verbotene Stelle.\n\nW = [0; ∞[\n\nBegründung: Ein Quadrat wird nie negativ. Der kleinste mögliche Wert ist 0, und den erreicht die Funktion bei x = 0. Nach oben gibt es keine Grenze.\n\nDass W nicht ganz ℝ ist, wird oft übersehen — negative Funktionswerte kommen bei f(x) = x² schlicht nicht vor.",

     tipps:["Gibt es eine Zahl, die du nicht für x einsetzen darfst?","Kann x² jemals negativ werden? Was ist der kleinste Wert, der herauskommen kann?"]},
    {id:"QA4", typ:"mc", komp:"Q_K1", afb:"II",
     stamm:"Wie verhält sich f(x) = −2x² für betragsgroße Argumente?",
     optionen:[{text:"lim f(x) = −∞ für x → +∞ und ebenso für x → −∞", richtig:true},
               {text:"lim f(x) = +∞ für x → +∞ und lim f(x) = −∞ für x → −∞", mv:"Q6"},
               {text:"lim f(x) = +∞ für beide Richtungen, weil x² immer positiv ist", mv:"Q6"},
               {text:"lim f(x) = 0 für beide Richtungen", mv:"Q4"}],
     tipps:["Setze x = 10 und x = −10 ein. Welches Vorzeichen hat das Ergebnis jeweils?","x² wird für betragsgroße x immer größer. Was macht der Faktor −2 daraus?"]}
  ]},
  {nr:3, titel:"Verändern", frage:"Warum verschiebt das Minus nach rechts?", sozial:"ICH", aufgaben:[

/* ===================== Hilfsfunktionen ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function qrSvg(id, gr) {
  const q = QR[id]; if (!q) return "";
  return `<svg viewBox="0 0 ${q.n} ${q.n}" width="${gr || 84}" height="${gr || 84}" shape-rendering="crispEdges" style="display:block;flex-shrink:0">
    <rect width="${q.n}" height="${q.n}" fill="#fff"/><path stroke="#16233D" d="${q.d}"/></svg>`;
}

/* Abgabecode: JSON -> gzip (falls verfügbar) -> Base64 */
function bytesZuB64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(s);
}
async function baueCode(obj) {
  const roh = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === "function") {
    try {
      const cs = new CompressionStream("gzip");
      const w = cs.writable.getWriter(); w.write(roh); w.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      return "LWZ1:" + bytesZuB64(new Uint8Array(buf));
    } catch (e) { /* Rückfall */ }
  }
  return "LWJ1:" + bytesZuB64(roh);
}

let weg = null, kuerzel = "", daten = null, aktiv = 1;

const speicherSchluessel = () => "lernweg:" + weg.id + ":" + kuerzel;

function laden() {

  return { etappe: 1, log: {}, selbst: {}, tagebuch: "" };
}

/* ===================== Lernweg ===================== */
function zeigeWeg() {
  const w = $("#app"); w.innerHTML = "";
  w.appendChild(kopfleiste());
  const bilanz = aktiv > weg.etappen.length;
  if (bilanz) { w.appendChild(bilanzAnsicht()); return; }
  const grid = el("div", "lw-grid");
  grid.appendChild(wissensspeicher());
  grid.appendChild(etappenAnsicht());
  w.appendChild(grid);
}

function kopfleiste() {
  const k = el("div", "karte"); k.style.cssText = "padding:14px;margin-bottom:16px";
  const kopf = el("div"); kopf.style.cssText = "display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px";
  kopf.innerHTML = `<div class="mono" style="font-size:11.5px;color:var(--weich)"><strong style="color:var(--tinte)">${esc(kuerzel)}</strong> · ${esc(weg.titel)}</div>`;
  const ab = el("button", "btn-2", "Weg wechseln"); ab.style.padding = "5px 11px"; ab.style.fontSize = "12px";
  ab.onclick = () => { weg = null; zeigeStart(); };
  kopf.appendChild(ab); k.appendChild(kopf);

  const reihe = el("div", "etappen");
  weg.etappen.forEach((e) => {
    const erreicht = e.nr <= daten.etappe;
    const b = el("button", "et" + (e.nr === aktiv ? " aktiv" : erreicht ? "" : " zu"));
    const fertig = e.aufgaben.every((a) => daten.log[a.id]);
    b.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><span class="n">${e.nr}</span>${fertig ? '<span style="font-size:11px">✓</span>' : ""}</div><div class="t">${esc(e.titel)}</div>`;
    if (erreicht) b.onclick = () => { aktiv = e.nr; zeigeWeg(); };
    reihe.appendChild(b);
  });
  const bb = el("button", "et" + (aktiv > weg.etappen.length ? " aktiv" : daten.etappe > weg.etappen.length ? "" : " zu"));
  bb.innerHTML = '<div class="n">★</div><div class="t">Abgabe</div>';
  if (daten.etappe > weg.etappen.length) bb.onclick = () => { aktiv = weg.etappen.length + 1; zeigeWeg(); };
  reihe.appendChild(bb);
  k.appendChild(reihe);
  return k;
}

  const et = weg.etappen[aktiv - 1];
  const box = el("div", "karte lw-side"); box.style.padding = "15px";
  let alle = false;
  const male = () => {
    const passend = weg.wissen.filter((x) => alle || x.e.includes(et.nr));
    box.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px">
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px">Wissensspeicher</div>

      <div class="klein weich" style="margin-bottom:10px">${alle ? "Alle Begriffe des Lernwegs." : "Begriffe für Etappe " + et.nr + "."}</div>`

    $("#umsch", box).onclick = () => { alle = !alle; male(); };
  };
  male();
  return box;
}

        const g = el("div"); g.style.marginTop = "12px";
        g.innerHTML = `<div style="display:flex;gap:12px;align-items:center;background:var(--papier);border-radius:10px;padding:12px;opacity:.55">
            <div style="width:84px;height:84px;border-radius:8px;background:var(--netzfein);border:1px dashed var(--rand);flex-shrink:0"></div>
            <div class="klein weich"><strong style="color:var(--tinte);display:block;font-size:13px">Noch verschlossen</strong>Der QR-Code erscheint, sobald deine Vermutung steht.</div></div>`;
        const b = el("button", "btn", "Vermutung festhalten"); b.style.cssText += ";margin-top:10px;background:var(--ziel)";
        b.onclick = () => { if (!(box.dataset.txt || "").trim()) return; fest = true; male(); };
        g.appendChild(b); box.appendChild(g);
      }
      if (sperre && fest) {
        const z = el("div"); z.style.cssText = "display:flex;gap:14px;align-items:center;background:var(--papier);border-radius:10px;padding:12px;margin-top:12px";
        z.innerHTML = qrSvg(a.zugang.qr) + `<div class="klein weich"><strong style="color:var(--tinte);display:block;font-size:13px">Jetzt prüfen</strong>${esc(a.zugang.quelle)}<br><a href="${a.zugang.url}" target="_blank" rel="noopener" class="mono" style="font-size:11px;color:var(--marker)">Link öffnen</a></div>`;
        box.appendChild(z);
      }
      if (a.nachher && (!sperre || fest)) {
        const t = el("div"); t.style.cssText = "font-size:13.5px;color:var(--marker);font-weight:500;margin:14px 0 6px"; t.textContent = a.nachher;
        box.appendChild(t);
        const t2 = el("textarea"); t2.rows = 3; t2.placeholder = "Meine Vermutung war …"; t2.value = box.dataset.txt2 || "";
        t2.oninput = () => { box.dataset.txt2 = t2.value; };
        if (abgegeben) t2.readOnly = true;
        box.appendChild(t2);
      }

      if (!abgegeben) {
        const leiste = el("div"); leiste.style.cssText = "display:flex;gap:10px;margin-top:14px;flex-wrap:wrap";
        const ab = el("button", "btn-m", "Antwort abgeben und Lösung ansehen");
        ab.disabled = sperre && !fest;
        ab.onclick = () => { if (!(box.dataset.txt || "").trim()) return; abgegeben = true; male(); };
        leiste.appendChild(ab);
        if (a.tipps && tippStufe < a.tipps.length) {
          const tb = el("button", "btn-2", tippStufe === 0 ? "Erster Anstoß" : "Noch ein Anstoß");
          tb.onclick = () => { tippStufe++; male(); };
          leiste.appendChild(tb);
        }
        box.appendChild(leiste);
      }

      if (tippStufe > 0 && a.tipps) {
        const k = el("div", "kasten k-grau"); k.style.color = "var(--weich)";
        k.textContent = a.tipps.slice(0, tippStufe).join("\n\n");
        box.appendChild(k);
      }

      if (abgegeben) {
        const l = el("div", "kasten k-gruen");
        l.innerHTML = '<strong style="display:block;margin-bottom:6px">So könnte die Lösung aussehen</strong>' + esc(a.loesung || "");
        box.appendChild(l);
        const frage = el("div"); frage.style.cssText = "margin-top:16px;font-size:13.5px;font-weight:600";
        frage.textContent = "Vergleiche mit deiner Antwort: Wie gut trägt sie?";
        box.appendChild(frage);
        const wahlen = el("div"); wahlen.style.cssText = "display:flex;gap:8px;margin-top:9px;flex-wrap:wrap";
        ["trägt noch nicht", "teilweise", "trägt"].forEach((txt, i) => {
          const b = el("button", "btn-2", txt);
          b.onclick = () => {
            daten.log[a.id] = {
              r: i === 2 ? true : i === 0 ? false : null, s: i, w: null, mv: null,
              t: tippStufe, d: Math.round((Date.now() - start) / 1000),
              x: (box.dataset.txt || "") + (box.dataset.txt2 ? "\n\nNach dem Prüfen: " + box.dataset.txt2 : "")
            };
            weiter(a);
          };
          wahlen.appendChild(b);
        });
        box.appendChild(wahlen);
        const hin = el("div", "klein weich"); hin.style.marginTop = "9px";
        hin.textContent = "Sei ehrlich – deine Einschätzung hilft deiner Lehrkraft mehr als eine geschönte.";
        box.appendChild(hin);
      }
    }
  };

  const weiter = (a) => {
    const et = weg.etappen[aktiv - 1];
    if (et.aufgaben.every((x) => daten.log[x.id])) daten.etappe = Math.max(daten.etappe, Math.min(aktiv + 1, weg.etappen.length + 1));
    sichern(); zeigeWeg();
  };

  male();
  return box;
}

/* ===================== Bilanz und Abgabe ===================== */
function bilanzAnsicht() {
  const box = el("div", "karte");
  box.innerHTML = "<h2>Wo stehst du?</h2>";
  weg.kompetenzen.forEach((k) => {
    const z = el("div"); z.style.cssText = "border-top:1px solid var(--netz);padding:11px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap";
    z.innerHTML = `<div style="font-size:14px;flex:1 1 230px">${esc(k.text)}</div>`;
    const g = el("div"); g.style.cssText = "display:flex;gap:4px";
    ["noch nicht", "teils", "sicher"].forEach((v) => {
      const b = el("button", "btn-2", v); b.style.cssText += ";padding:5px 9px;font-size:11.5px;white-space:nowrap";
      if (daten.selbst[k.id] === v) { b.style.background = "var(--tinte)"; b.style.color = "#fff"; }
      b.onclick = () => { daten.selbst[k.id] = v; sichern(); zeigeWeg(); };
      g.appendChild(b);
    });
    z.appendChild(g); box.appendChild(z);
  });

  const tb = el("div"); tb.style.cssText = "margin-top:16px;font-size:13.5px;color:var(--marker);font-weight:500;margin-bottom:6px";
  tb.textContent = "Was verstehst du jetzt, das du vorher nicht verstanden hast?";
  box.appendChild(tb);
  const ta = el("textarea"); ta.rows = 4; ta.placeholder = "Vorher dachte ich … Jetzt weiß ich …"; ta.value = daten.tagebuch || "";
  ta.oninput = () => { daten.tagebuch = ta.value; sichern(); };
  box.appendChild(ta);

  const abg = el("div"); abg.style.cssText = "margin-top:22px;padding-top:18px;border-top:1px solid var(--netz)";
  abg.innerHTML = `<h3>Abgabe</h3><div class="klein weich" style="margin-bottom:12px;line-height:1.6">
    Erzeuge deinen Abgabecode, kopiere ihn und schicke ihn per E-Mail an deine Lehrkraft. Der Code enthält deine Antworten und dein Kürzel – sonst nichts.</div>`;
  const btn = el("button", "btn", "Abgabecode erzeugen");
  abg.appendChild(btn);
  const ziel = el("div"); abg.appendChild(ziel);

  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "wird erzeugt …";
    const nutz = { v: 1, k: kuerzel, p: weg.id, a: daten.log, z: daten.selbst, tb: daten.tagebuch || "", d: new Date().toISOString().slice(0, 10) };
    const code = await baueCode(nutz);
    btn.style.display = "none";
    ziel.innerHTML = `<div class="klein weich" style="margin:14px 0 6px">Dein Abgabecode</div>`;
    const feld = el("textarea"); feld.rows = 4; feld.readOnly = true; feld.value = code;
    feld.className = "mono"; feld.style.fontSize = "11px"; feld.style.wordBreak = "break-all";
    ziel.appendChild(feld);
    const leiste = el("div"); leiste.style.cssText = "display:flex;gap:10px;margin-top:12px;flex-wrap:wrap";
    const kop = el("button", "btn", "Code kopieren");
    kop.onclick = async () => {
      try { await navigator.clipboard.writeText(code); } catch (e) { feld.select(); document.execCommand("copy"); }
      kop.textContent = "kopiert ✓"; setTimeout(() => (kop.textContent = "Code kopieren"), 1800);
    };
    leiste.appendChild(kop);
    const mail = el("a", "btn"); mail.style.textDecoration = "none"; mail.style.display = "inline-block"; mail.textContent = "E-Mail öffnen";
    mail.style.background = "var(--marker)";
    const betreff = encodeURIComponent("Lernweg " + weg.titel + " – " + kuerzel);
    const rumpf = encodeURIComponent("Hier ist mein Abgabecode:\n\n[Code hier einfügen – Strg+V bzw. cmd+V]\n\n");
    mail.href = "mailto:" + LEHRKRAFT_MAIL + "?subject=" + betreff + "&body=" + rumpf;
    leiste.appendChild(mail);
    ziel.appendChild(leiste);
    const hin = el("div", "kasten k-gold");
    hin.textContent = "Reihenfolge: erst „Code kopieren“, dann „E-Mail öffnen“ und den Code in die Mail einfügen. Manche Mail-Programme kürzen lange Texte – prüfe vor dem Senden, ob der Code vollständig drin ist und mit LWZ1: oder LWJ1: beginnt.";
    ziel.appendChild(hin);
  };
  box.appendChild(abg);
  return box;
}

/* ===================== Start ===================== */
zeigeStart();
